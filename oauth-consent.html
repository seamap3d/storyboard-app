<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect storyboard account</title></head><body>
<main><h1>Connect your storyboard account</h1><p id="environment"></p><p>Allow this client to read projects you belong to and attach images where you have editing permission. Access follows your current project roles.</p>
<form id="signin" hidden><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<pre id="details"></pre><div id="actions" hidden><button id="approve">Allow access</button><button id="deny">Deny</button></div><p id="status" role="status"></p></main><script type="module" src="/oauth-consent.mjs"></script></body></html>
